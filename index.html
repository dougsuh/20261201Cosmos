const homePage = document.getElementById('homePage');
const songPage = document.getElementById('songPage');
const heading = document.getElementById('pageHeading');
const sub = document.getElementById('pageSub');

songs.forEach((song, i) => {
  const a = document.createElement('a');
  a.className = 'song-link';
  a.href = '#song-' + i;
  const num = document.createElement('span');
  num.className = 'num';
  num.textContent = String(i + 1).padStart(2, '0');
  const title = document.createElement('span');
  title.className = 'song-title';
  title.textContent = song.title;
  a.append(num, title);
  homePage.appendChild(a);
});

function showPage() {
  const match = location.hash.match(/^#song-(\d+)$/);
  if (!match) {
    homePage.style.display = 'grid';
    songPage.style.display = 'none';
    heading.textContent = '경동고 졸업 51주년 기념';
    sub.textContent = '곡을 선택하세요 · 총 ' + songs.length + '곡';
    return;
  }
  const i = Number(match[1]);
  if (i < 0 || i >= songs.length) { location.hash = ''; return; }
  const song = songs[i];
  homePage.style.display = 'none';
  songPage.style.display = 'block';
  heading.textContent = song.title;
  sub.textContent = (i + 1) + ' / ' + songs.length;
  document.getElementById('lyrics').innerHTML = song.lyricsHtml;
  document.getElementById('prevBtn').href = '#song-' + ((i - 1 + songs.length) % songs.length);
  document.getElementById('nextBtn').href = '#song-' + ((i + 1) % songs.length);
  document.getElementById('homeBtn').href = '#';
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', showPage);
showPage();
</script>
